networks:
  # Used only by the simulated player VMs (see DEPLOY.md). Each VM gets its own
  # network, so player_vm1 cannot reach player_vm2. Both reach kiwix1 and
  # platform. `internal: true` blocks internet access. player1 and player2 use
  # the default network.
  player1_net:
    internal: true
  player2_net:
    internal: true

# The images are built by the Makefile (`make up`), not by `docker compose`.
# The builds use the network of the host, and recent versions of Docker Compose
# refuse that unless the build gets `--allow=network.host`, which only
# `docker buildx bake` accepts. `pull_policy: never` makes Compose use the
# images built by `make` and never try to build or download them.
services:
  kiwix1:
    image: ghcr.io/kiwix/kiwix-serve:latest
    volumes:
      - ./.data/zim:/data:ro
    command: ["/data/${KIWIX_BOOK:-wikipedia_en_top_nopic}.zim"]
    ports:
      - "8080:8080"
    networks:
      - default
      - player1_net
      - player2_net

  platform:
    image: wikirace-platform
    pull_policy: never
    build:
      context: ./platform
      # Some networks block DNS for Docker builds. The build uses the network
      # of the host, so `mix deps.get` can download packages.
      network: host
    depends_on:
      - kiwix1
    environment:
      NODE_NAME: platform@platform
      ERL_COOKIE: wikirace
      KIWIX_BASE_URL: http://kiwix1:8080
      KIWIX_BOOK: ${KIWIX_BOOK:-wikipedia_en_top_nopic}
      PORT: "4000"
    ports:
      - "4000:4000"
    volumes:
      - ./platform:/app
      - /app/_build
      - /app/deps
    networks:
      - default
      - player1_net
      - player2_net

  # player1 and player2 both run the player/ folder, as two separate nodes.
  # Changes in player/lib take effect after `docker compose restart player1 player2`.
  player1:
    image: wikirace-player
    pull_policy: never
    build:
      context: ./player
      network: host
    depends_on:
      - platform
    environment:
      NODE_NAME: player1@player1
      ERL_COOKIE: wikirace
      PLATFORM_NODE: platform@platform
    volumes:
      - ./player:/app
      - /app/_build
      - /app/deps

  player2:
    image: wikirace-player
    pull_policy: never
    build:
      context: ./player
      network: host
    depends_on:
      - platform
    environment:
      NODE_NAME: player2@player2
      ERL_COOKIE: wikirace
      PLATFORM_NODE: platform@platform
    volumes:
      - ./player:/app
      - /app/_build
      - /app/deps

  # Professor only (see DEPLOY.md). A simulated player VM with a real sshd. The
  # platform uploads a release to it and starts it over SSH. Not started by
  # `make up`. `deploy/keys/id_ed25519.pub` comes from `make deploy-keys`.
  player_vm1:
    image: wikirace-vm
    pull_policy: never
    profiles: ["deploy"]
    build:
      context: ./deploy/vm
      network: host
    volumes:
      - ./deploy/keys/id_ed25519.pub:/home/deploy/.ssh/authorized_keys:ro
    networks:
      - player1_net
    # Read-only filesystem. Only /tmp, /run and /home/deploy/releases are
    # writable. The release is unpacked and runs in /home/deploy/releases.
    read_only: true
    tmpfs:
      - /tmp
      - /run
      # tmpfs does not allow running programs by default. The release runs
      # from here, so this one path allows it.
      - /home/deploy/releases:exec,size=256m
    mem_limit: 512m
    cpus: 1.0

  player_vm2:
    image: wikirace-vm
    pull_policy: never
    profiles: ["deploy"]
    build:
      context: ./deploy/vm
      network: host
    volumes:
      - ./deploy/keys/id_ed25519.pub:/home/deploy/.ssh/authorized_keys:ro
    networks:
      - player2_net
    read_only: true
    tmpfs:
      - /tmp
      - /run
      # tmpfs does not allow running programs by default. The release runs
      # from here, so this one path allows it.
      - /home/deploy/releases:exec,size=256m
    mem_limit: 512m
    cpus: 1.0

  # Professor only (see DEPLOY.md). Builds the release of a group on the same
  # image the player VMs use, so the release runs there. Used through
  # `docker compose run --rm release_builder ...`, never started by `up`.
  release_builder:
    image: wikirace-vm
    pull_policy: never
    build:
      context: ./deploy/vm
      network: host
    # Uses the network of the host, like the platform build, so
    # `mix deps.get` can download packages when it runs.
    network_mode: host
    profiles: ["tools"]
